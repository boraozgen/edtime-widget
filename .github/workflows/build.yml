name: Build

# Builds a single self-contained EdtimeWidget.exe (no .NET install needed).
# Every run uploads it as a workflow artifact; pushing a tag like v1.2.3 also publishes a GitHub release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = ([xml](Get-Content src/EdtimeWidget/EdtimeWidget.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/EdtimeWidget -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: EdtimeWidget-${{ steps.version.outputs.version }}
          path: publish/EdtimeWidget.exe

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/EdtimeWidget.exe --title "${{ github.ref_name }}" --generate-notes
